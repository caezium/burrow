name: sentry-issues

# Poll Sentry for newly-detected issues and open a matching GitHub issue for
# each one, so crashes/errors surface as tracked work without anyone watching
# the Sentry dashboard.
#
# Why a poller and not Sentry's native "create GitHub issue" alert action:
# that action is gated behind Sentry's Business billing plan, which this org
# isn't on. This workflow needs only a read-only Sentry auth token and the
# free plan's API.
#
# Public issues contain only a small allowlist of bounded operational fields.
# Stack traces, paths, arguments, usernames, and event payloads stay in the
# restricted Sentry project and must cross a human privacy-review boundary
# before anyone copies a diagnosis into GitHub.
#
# App-Hang groups are collected into one rolling weekly digest instead of
# opening one GitHub issue per sampled top frame. The digest still carries
# every Sentry short-id and bounded release/build tags, so hangs stay visible
# without flooding the tracker or publishing diagnostic payloads.
#
# Dedup is by a hidden marker line ("sentry-id: <short-id>") in the body of
# every issue or digest we file. Before filing, we read back the short-ids of all
# existing `sentry`-labelled issues (open AND closed) and skip any we've
# already filed — so a given Sentry issue is filed exactly once, even after
# its GitHub issue is closed.
#
# State follows Sentry (scripts/sentry_issue_sync.py). An issue or digest
# closes once Sentry confirms every short-id it carries is resolved or
# ignored, and reopens when Sentry reports one regressed after the close.
# Issues closed as not planned (duplicates, won't-fix) stay closed. The sync
# only acts on a project whose unresolved list arrived whole, only under the
# default `is:unresolved` query, and only on an explicit per-issue status.
#
# One-time setup:
#   1. Sentry → Settings → Auth Tokens → Create New Token with scopes
#      `project:read`, `event:read`, `org:read` (read-only).
#   2. Add it to this repo as a secret named SENTRY_AUTH_TOKEN:
#        gh secret set SENTRY_AUTH_TOKEN --repo caezium/Burrow
#   Until the secret exists, runs no-op with a warning (they don't fail).

on:
  schedule:
    # Every 30 minutes, off the :00/:30 rush. UTC (GitHub cron is always UTC).
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      query:
        description: "Sentry issue search query"
        default: "is:unresolved"
      lookback_hours:
        description: "Only file issues first seen within this many hours"
        default: "168"

permissions:
  contents: read
  issues: write

concurrency:
  # Never let two runs file issues at the same time (would race the dedup read).
  group: sentry-issues
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTRY_HOST: https://sentry.io
      SENTRY_ORG: henry-zhang-r7
      # Space-separated project slugs to watch. Both Burrow apps.
      SENTRY_PROJECTS: "burrow burrow-windows"
      SENTRY_QUERY: ${{ github.event.inputs.query || 'is:unresolved' }}
      # 7 days, not 24h: GitHub throttles the 30-min cron to ~every 2h, and a 24h
      # firstSeen cutoff PERMANENTLY (and silently) dropped anything older — the
      # seen-list already prevents duplicates, so the cutoff only needs to guard
      # against ancient-backfill floods.
      LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '168' }}
      # Cap creations per run so a backlog can't open hundreds of issues at once.
      MAX_PER_RUN: "25"
      # Bound each App-Hang batch so its table and markers fit inside
      # GitHub's 65,536-character issue-body limit with room to append safely.
      MAX_HANG_GROUPS_PER_RUN: "20"
      MAX_ISSUE_BODY_BYTES: "60000"
      # Defensive ceiling against a malformed cursor loop. Normal runs exhaust
      # the Sentry result set long before this (100 pages × 50 groups).
      MAX_SENTRY_PAGES_PER_PROJECT: "100"
      # Bound closes + reopens per run, so a logic error can't sweep the tracker.
      MAX_SYNC_ACTIONS_PER_RUN: "50"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout privacy filter
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Poll Sentry and file GitHub issues
        run: |
          set -euo pipefail

          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set — nothing to do."
            exit 0
          fi

          cutoff=$(date -u -d "${LOOKBACK_HOURS} hours ago" +%s)
          echo "Filing issues first seen on/after $(date -u -d "@${cutoff}" '+%Y-%m-%d %H:%M UTC')"

          # Short-ids we've already filed (open + closed), so we never duplicate.
          #
          # Fail closed: an unreadable list must stop the run, never pass as
          # "nothing filed yet". On 2026-10-03 a silently failed read did
          # exactly that and re-filed every Sentry issue inside the lookback.
          seen="$(mktemp)"
          filed_bodies="$(mktemp)"
          read_ok=0
          for attempt in 1 2 3; do
            if gh issue list --repo "$GH_REPO" --label sentry --state all --limit 1000 \
                 --json body --jq '.[].body' > "$filed_bodies"; then
              read_ok=1
              break
            fi
            echo "::warning::Reading already-filed sentry issues failed (attempt ${attempt}/3)."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          if [ "$read_ok" -ne 1 ]; then
            echo "::error::Could not read already-filed sentry issues; filing nothing this run."
            exit 1
          fi
          { grep -oE 'sentry-id: [^ <]+' "$filed_bodies" || true; } \
            | awk '{print $2}' | sort -u > "$seen"
          # A read that succeeds yet finds no markers while sentry issues exist
          # is the same failure in disguise. Only a truly empty tracker (the
          # very first run) may proceed with an empty list.
          if [ ! -s "$seen" ]; then
            existing=$(gh issue list --repo "$GH_REPO" --label sentry --state all --limit 1 \
              --json number --jq 'length') || existing="unknown"
            if [ "$existing" != "0" ]; then
              echo "::error::Read back no sentry-id markers, but sentry issues exist (${existing}); filing nothing this run."
              exit 1
            fi
          fi
          echo "Already filed: $(wc -l < "$seen" | tr -d ' ') Sentry issue(s)."
          hang_rows="$(mktemp)"
          hang_markers="$(mktemp)"
          hang_count=0
          # For the state sync after filing: what Sentry listed as unresolved,
          # and which projects' lists arrived whole (every page, no cap hit).
          unresolved="$(mktemp)"
          complete_projects=""

          filed=0
          for project in $SENTRY_PROJECTS; do
            # $q below is jq syntax, not a shell variable.
            # shellcheck disable=SC2016
            q=$(jq -rn --arg q "$SENTRY_QUERY" '$q | @uri')
            url="${SENTRY_HOST}/api/0/projects/${SENTRY_ORG}/${project}/issues/?query=${q}&sort=new&limit=50"
            response_rows="$(mktemp)"
            page_url="$url"
            page_count=0
            fetched=0
            fetch_complete=1

            # Sentry's issue endpoint is cursor-paginated through its Link
            # response header. Collect every page so unresolved groups that
            # have fallen past the newest 50 cannot be starved by already-seen
            # groups at the front of the result set.
            while [ -n "$page_url" ]; do
              headers="$(mktemp)"
              page="$(mktemp)"
              if ! curl -fsS -D "$headers" -o "$page" \
                   -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" "$page_url"; then
                echo "::warning::Sentry API request failed for project '${project}' page $((page_count + 1)); processing pages already fetched."
                fetch_complete=0
                break
              fi

              page_fetched=$(jq 'if type=="array" then length else -1 end' "$page" 2>/dev/null || echo -1)
              if [ "$page_fetched" = "-1" ]; then
                echo "::warning::Sentry returned a non-array response for '${project}' page $((page_count + 1)); processing pages already fetched without logging the payload."
                fetch_complete=0
                break
              fi
              jq -c '.[]' "$page" >> "$response_rows"
              fetched=$((fetched + page_fetched))
              page_count=$((page_count + 1))

              page_url=""
              link_header=$(tr -d '\r' < "$headers" | sed -n 's/^[Ll]ink:[[:space:]]*//p' || true)
              while IFS= read -r link; do
                if [[ "$link" == *'rel="next"'* && "$link" == *'results="true"'* ]]; then
                  candidate="${link#*<}"
                  page_url="${candidate%%>*}"
                  break
                fi
              done < <(printf '%s' "$link_header" | tr ',' '\n')

              if [ "$page_count" -ge "$MAX_SENTRY_PAGES_PER_PROJECT" ] && [ -n "$page_url" ]; then
                echo "::warning::Stopped Sentry pagination for '${project}' at ${page_count} pages to avoid a malformed cursor loop."
                fetch_complete=0
                page_url=""
              fi
            done

            if [ "$page_count" -eq 0 ]; then
              echo "::warning::No valid Sentry issue page was fetched for '${project}' — skipping."
              continue
            fi
            echo "project ${project}: fetched ${fetched} unresolved issue(s) across ${page_count} page(s)."
            # Recorded before filing: MAX_PER_RUN's `break 2` below must not
            # drop a project whose list did arrive whole.
            jq -c '{shortId: .shortId, lastSeen: .lastSeen}' "$response_rows" >> "$unresolved"
            if [ "$fetch_complete" -eq 1 ]; then
              complete_projects="${complete_projects} ${project}"
            fi
            skipped_seen=0
            skipped_old=0

            while IFS= read -r issue; do
              [ -z "$issue" ] && continue

              # Raw Sentry objects remain in temporary files and are reduced by
              # a fail-closed allowlist before any value can reach GitHub.
              issue_json="$(mktemp)"
              event_json="$(mktemp)"
              summary_json="$(mktemp)"
              printf '%s\n' "$issue" > "$issue_json"
              printf '{}\n' > "$event_json"

              issueId=$(jq -r '.id // empty' "$issue_json" 2>/dev/null || true)
              if [[ "$issueId" =~ ^[0-9]{1,20}$ ]]; then
                if ! curl -fsS -o "$event_json" \
                     -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
                     "${SENTRY_HOST}/api/0/organizations/${SENTRY_ORG}/issues/${issueId}/events/latest/"; then
                  printf '{}\n' > "$event_json"
                  echo "::warning::Latest event unavailable; filing only the allowlisted issue summary."
                fi
              fi

              if ! python3 scripts/sentry_public_summary.py \
                   --issue-file "$issue_json" \
                   --event-file "$event_json" \
                   --org "$SENTRY_ORG" \
                   --project "$project" > "$summary_json"; then
                echo "::warning::Refusing to publish a Sentry issue that did not pass the public-summary policy."
                rm -f "$issue_json" "$event_json" "$summary_json"
                continue
              fi
              rm -f "$issue_json" "$event_json"

              shortId=$(jq -r '.shortId' "$summary_json")
              permalink=$(jq -r '.sentryUrl' "$summary_json")
              level=$(jq -r '.level' "$summary_json")
              count=$(jq -r '.count' "$summary_json")
              release=$(jq -r '.release' "$summary_json")
              osBuild=$(jq -r '.osBuild' "$summary_json")
              launchPhase=$(jq -r '.launchPhase' "$summary_json")
              statusItem=$(jq -r '.statusItem' "$summary_json")
              firstSeen=$(jq -r '.firstSeen' "$summary_json")
              lastSeen=$(jq -r '.lastSeen' "$summary_json")
              isAppHang=$(jq -r '.isAppHang' "$summary_json")
              rm -f "$summary_json"

              # Already filed?
              if grep -qxF "$shortId" "$seen"; then
                skipped_seen=$((skipped_seen + 1))
                continue
              fi

              fsEpoch=$(date -u -d "$firstSeen" +%s 2>/dev/null || echo 0)
              if [ "$fsEpoch" -lt "$cutoff" ]; then
                echo "Skipping ${shortId}: firstSeen ${firstSeen} is outside the ${LOOKBACK_HOURS}h lookback."
                skipped_old=$((skipped_old + 1))
                continue
              fi

              # The reducer classifies hangs internally; neither the raw title
              # nor any frame used by Sentry to group a hang reaches GitHub.
              if [ "$isAppHang" = "true" ]; then
                if [ "$hang_count" -ge "$MAX_HANG_GROUPS_PER_RUN" ]; then
                  echo "Deferring App-Hang ${shortId}: this run's bounded digest batch is full."
                  continue
                fi

                # Backticks are literal Markdown delimiters.
                # shellcheck disable=SC2016
                printf '| [%s](%s) | `%s` | %s | `%s` | `%s` | `%s` | %s | %s |\n' \
                  "$shortId" "$permalink" "$project" "$count" "$release" "$osBuild" \
                  "$launchPhase" "$statusItem" "$lastSeen" >> "$hang_rows"
                printf '<sub>sentry-id: %s — managed marker, do not edit or remove.</sub>\n' "$shortId" >> "$hang_markers"
                echo "$shortId" >> "$seen"
                hang_count=$((hang_count + 1))
                echo "Queued App-Hang ${shortId} for the weekly digest."
                continue
              fi

              if [ "$filed" -ge "$MAX_PER_RUN" ]; then
                echo "::warning::Hit MAX_PER_RUN=${MAX_PER_RUN}; remaining new issues will be filed next run."
                break 2
              fi

              printf -v body '%s\n' \
                "Auto-filed from Sentry by the \`sentry-issues\` workflow. This public issue contains only the workflow's allowlisted operational summary." \
                "Detailed diagnostics stay in restricted Sentry. Review them there; copy only a minimal, privacy-reviewed diagnosis into this public issue." \
                "" \
                "| | |" \
                "|---|---|" \
                "| **Sentry issue** | [${shortId}](${permalink}) |" \
                "| **Project** | \`${project}\` |" \
                "| **Level** | ${level} |" \
                "| **Events** | ${count} |" \
                "| **Release** | \`${release}\` |" \
                "| **OS build** | \`${osBuild}\` |" \
                "| **Launch phase** | \`${launchPhase}\` |" \
                "| **Status item** | \`${statusItem}\` |" \
                "| **First seen** | ${firstSeen} |" \
                "| **Last seen** | ${lastSeen} |"

              # Keep the managed marker LAST: the dedup read greps for
              # 'sentry-id:' across all sentry-labelled issues.
              body="${body}
          <sub>sentry-id: ${shortId} — managed marker, do not edit or remove (prevents duplicate filings).</sub>
              "
              if gh issue create --repo "$GH_REPO" \
                   --title "[Sentry] ${shortId}: restricted diagnostic" \
                   --label sentry \
                   --body "$body" >/dev/null; then
                echo "Filed allowlisted public summary for ${shortId}."
                echo "$shortId" >> "$seen"   # dedup within this run too
                filed=$((filed + 1))
              else
                echo "::warning::Failed to create GitHub issue for ${shortId}."
              fi
            done < "$response_rows"
            echo "project ${project}: ${skipped_seen} already filed, ${skipped_old} outside lookback."
          done

          if [ "$hang_count" -gt 0 ]; then
            digest_week=$(date -u +'%G-W%V')
            digest_base_title="[Sentry] App-Hang digest — ${digest_week}"
            digest_section="$(mktemp)"
            {
              printf '\n## New groups observed %s\n\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
              printf '| Sentry | Project | Events | Release | OS build | Launch phase | Status item | Last seen |\n'
              printf '|---|---|---:|---|---|---|---|---|\n'
              cat "$hang_rows"
              printf '\n'
              cat "$hang_markers"
            } > "$digest_section"

            digest_list=$(gh issue list --repo "$GH_REPO" --label sentry --state open --limit 100 \
              --json number,title)
            digest_part=1
            digest_title="$digest_base_title"
            digest_number=""
            while :; do
              # $title below is jq syntax, not a shell variable.
              # shellcheck disable=SC2016
              candidate_number=$(jq -r --arg title "$digest_title" \
                '.[] | select(.title == $title) | .number' <<<"$digest_list" | head -n 1)
              [ -n "$candidate_number" ] || break
              digest_number="$candidate_number"
              digest_part=$((digest_part + 1))
              digest_title="${digest_base_title} — part ${digest_part}"
            done

            # If the latest open part still has room, append there. Otherwise,
            # create the next numbered part. The per-run group bounds
            # above guarantee a fresh part stays below the body limit.
            if [ -n "$digest_number" ]; then
              digest_body="$(mktemp)"
              gh issue view "$digest_number" --repo "$GH_REPO" --json body --jq '.body' > "$digest_body"
              existing_bytes=$(wc -c < "$digest_body" | tr -d ' ')
              section_bytes=$(wc -c < "$digest_section" | tr -d ' ')
              if [ $((existing_bytes + section_bytes)) -le "$MAX_ISSUE_BODY_BYTES" ]; then
                cat "$digest_section" >> "$digest_body"
                gh issue edit "$digest_number" --repo "$GH_REPO" --body-file "$digest_body" >/dev/null
                echo "Updated App-Hang digest #${digest_number} with ${hang_count} new group(s)."
                digest_number="updated"
              else
                digest_number=""
                echo "Rolling App-Hang digest into part ${digest_part}; the prior part is ${existing_bytes} bytes."
              fi
            fi

            if [ -z "$digest_number" ]; then
              digest_body="$(mktemp)"
              {
                # Backticks are literal Markdown delimiters.
                # shellcheck disable=SC2016
                printf '%s\n\n' 'Auto-filed from Sentry by the `sentry-issues` workflow.'
                printf '%s\n' 'App-Hang samples can split into several Sentry groups when their top frames differ. This weekly digest keeps every group visible without opening one GitHub issue per sampled frame.'
                printf '%s\n' 'Detailed diagnostics stay in restricted Sentry. Review them there; copy only a minimal, privacy-reviewed diagnosis into this public issue.'
                cat "$digest_section"
              } > "$digest_body"
              gh issue create --repo "$GH_REPO" --title "$digest_title" --label sentry \
                --body-file "$digest_body" >/dev/null
              echo "Created App-Hang digest part ${digest_part} with ${hang_count} new group(s)."
            fi
          fi

          # Mirror Sentry's state onto what we filed. Read the tracker fresh:
          # a digest appended to above now carries unresolved groups and must
          # not be closed on its older markers alone.
          closed=0
          reopened=0
          if [ "$SENTRY_QUERY" != "is:unresolved" ]; then
            echo "Custom query '${SENTRY_QUERY}': not syncing issue state this run."
          else
            tracked="$(mktemp)"
            if ! gh issue list --repo "$GH_REPO" --label sentry --state all --limit 1000 \
                   --json number,state,stateReason,closedAt,body > "$tracked"; then
              echo "::warning::Could not read sentry issues for the state sync; skipping it this run."
            else
              lookups="$(mktemp)"
              statuses="$(mktemp)"
              sync_actions="$(mktemp)"
              python3 scripts/sentry_issue_sync.py candidates --issues "$tracked" \
                --unresolved "$unresolved" --complete "$complete_projects" > "$lookups"
              # Only an explicit status from Sentry closes or reopens an issue;
              # absence from the unresolved list proves nothing on its own.
              while IFS= read -r sid; do
                lookup="$(mktemp)"
                if curl -fsS -o "$lookup" -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
                     "${SENTRY_HOST}/api/0/organizations/${SENTRY_ORG}/shortids/${sid}/"; then
                  jq -c --arg sid "$sid" \
                    '{shortId: $sid, status: (.group.status // ""), substatus: (.group.substatus // "")}' \
                    "$lookup" >> "$statuses" || true
                else
                  echo "Could not confirm ${sid} with Sentry; leaving its issue as is."
                fi
                rm -f "$lookup"
              done < "$lookups"
              python3 scripts/sentry_issue_sync.py actions --issues "$tracked" \
                --unresolved "$unresolved" --complete "$complete_projects" \
                --statuses "$statuses" --limit "$MAX_SYNC_ACTIONS_PER_RUN" > "$sync_actions"

              while IFS=$'\t' read -r action number reason ids; do
                ids_list="${ids//,/, }"
                case "$action:$reason" in
                  close:completed)
                    gh issue close "$number" --repo "$GH_REPO" --reason completed \
                      --comment "Sentry no longer lists ${ids_list} as unresolved (resolved or ignored there). This issue reopens automatically if Sentry reports a regression." >/dev/null \
                      && closed=$((closed + 1)) && echo "Closed #${number}: no longer unresolved in Sentry (${ids_list})."
                    ;;
                  close:not_planned)
                    gh issue close "$number" --repo "$GH_REPO" --reason "not planned" \
                      --comment "Ignored in Sentry (${ids_list})." >/dev/null \
                      && closed=$((closed + 1)) && echo "Closed #${number}: ignored in Sentry (${ids_list})."
                    ;;
                  reopen:regressed)
                    gh issue reopen "$number" --repo "$GH_REPO" \
                      --comment "Sentry reports a regression (${ids_list}): new events after this issue was closed." >/dev/null \
                      && reopened=$((reopened + 1)) && echo "Reopened #${number}: regressed in Sentry (${ids_list})."
                    ;;
                esac || echo "::warning::Failed to ${action} #${number}."
              done < "$sync_actions"
            fi
          fi

          echo "Done. Filed ${filed} regular issue(s); recorded ${hang_count} App-Hang group(s); closed ${closed}, reopened ${reopened}."
