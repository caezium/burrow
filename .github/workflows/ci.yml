name: ci

# Build + run the unit suite on every push/PR. The suite is hermetic on a
# bare runner: tests that need the real `mo` binary or TCC-protected
# folders skip themselves (XCTSkipUnless / env opt-ins), Store writes go to
# a scratch defaults suite, and the hosted app stays inert under XCTest.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Greenlight
        run: brew install revylai/tap/greenlight
      - name: App distribution preflight
        run: greenlight preflight macos --exit-code
      - name: Test release safety helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Test website analytics boundaries
        run: node --test scripts/tests/test_site_analytics.mjs
      - name: Check translated site pages are current
        run: python3 scripts/site-i18n.py --check

  test:
    runs-on: macos-15
    timeout-minutes: 30
    # The macOS app lives under macos/ (the repo is a monorepo: macos/ +
    # windows/). xcodegen/xcodebuild run from there; checkout still lands at
    # the repo root, so this only affects `run:` steps.
    defaults:
      run:
        working-directory: macos
    steps:
      # Pinned to a commit SHA, not a floating tag (supply-chain hygiene;
      # comment keeps the version legible).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select newest Xcode
        run: |
          shopt -s nullglob
          XCODE_APPS=(/Applications/Xcode_*.app)
          [ "${#XCODE_APPS[@]}" -gt 0 ] \
            || { echo "::error::No versioned Xcode app found on the runner."; exit 1; }
          XCODE="$(printf '%s\n' "${XCODE_APPS[@]}" | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install checksum-pinned XcodeGen
        run: |
          bash ../scripts/fetch-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # Sentry is a vendored local framework (not SPM — its binary download
      # hangs xcodebuild). Fetch it before generating the project, or xcodegen
      # references a missing framework. (Job working-directory is macos/.)
      - name: Fetch vendored Sentry framework
        run: bash ../scripts/fetch-sentry.sh

      # Sparkle's Swift package wraps a binary artifact, and that artifact
      # downloader hard-hung both v0.11.0 release attempts. Fetch the official
      # checksum-pinned universal framework directly instead.
      - name: Fetch vendored Sparkle framework
        run: bash ../scripts/fetch-sparkle.sh

      - name: Verify deterministic generated metadata
        run: |
          python3 ../scripts/verify-project-generation.py \
            --xcodegen "$(command -v xcodegen)" --check-git

      - name: Test
        run: |
          xcodebuild test -project Burrow.xcodeproj -scheme Burrow \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  # GitHub's Xcode 27 public-preview image currently runs macOS 26.5.2, so
  # this catches compiler and macOS 27 SDK incompatibilities rather than the
  # macOS 27 MenuBarAgent runtime regression. Keep the stable macOS 15 job as
  # the release gate until GitHub offers a macOS 27 host image.
  xcode-27-compatibility:
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Show preview environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Install checksum-pinned XcodeGen
        run: |
          bash ../scripts/fetch-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Fetch vendored Sentry framework
        run: bash ../scripts/fetch-sentry.sh

      - name: Fetch vendored Sparkle framework
        run: bash ../scripts/fetch-sparkle.sh

      - name: Generate project
        run: xcodegen generate

      - name: Test against Xcode 27 and the macOS 27 SDK
        run: |
          xcodebuild test -project Burrow.xcodeproj -scheme Burrow \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  # Validate the fclones sidecar cross-compiles universal (the Duplicates dependency). Runs on
  # the fclones scripts so it proves + caches the build before a release relies on it.
  fclones-sidecar:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Cache fclones sidecar
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/burrow-fclones
          key: fclones-universal-0.35.0
      - name: Build universal fclones
        run: bash scripts/build-fclones.sh
      - name: Assert it is universal
        run: |
          F="$HOME/.cache/burrow-fclones/fclones-universal-0.35.0"
          ARCHES="$(lipo -archs "$F")"
          if ! grep -q arm64 <<< "$ARCHES" || ! grep -q x86_64 <<< "$ARCHES"; then
            echo "::error::fclones not universal: $ARCHES"
            exit 1
          fi
          "$F" --version
