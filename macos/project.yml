# xcodegen spec — single source of truth for the Burrow Xcode project.
# Regenerate with `xcodegen generate`. The .xcodeproj is gitignored so
# diffs stay readable; the spec is small and stable.
name: Burrow
options:
  bundleIdPrefix: dev.caezium
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The only app/build version declarations. The generated Info.plist keeps
    # these build-setting references, and Xcode expands them in the product.
    MARKETING_VERSION: "0.14.0"
    CURRENT_PROJECT_VERSION: "26"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode leaves signing off for reproducible builds. Local scripts apply a
    # coherent ad-hoc signature; the tag workflow applies Developer ID after
    # every nested executable has been staged.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEAD_CODE_STRIPPING: YES

# Telemetry. PostHog analytics use Burrow's small background HTTPS transport;
# Sentry is the only telemetry SDK. Both paths are inert unless a release
# injects keys below, so a plain dev build never touches either network.
# Sentry is NOT an SPM package: SPM eagerly downloads ALL of sentry-cocoa's
# binary xcframework variants during resolution (Sentry, -Dynamic, -WithARM64e,
# …, ~500 MB), and on the release runner that download hard-hangs xcodebuild
# (curl pulls the same artifact in <1s — it's an SPM-downloader problem). So we
# vendor only the one static Sentry.xcframework we actually use, fetched by
# scripts/fetch-sentry.sh (curl), and link it directly. The version is pinned;
# CrashReporter.swift owns the explicit privacy, hang, trace, and profile policy.
# Sparkle is also a local framework: its Swift package wraps a binary artifact,
# and that artifact-resolution step hard-hung both v0.11.0 release attempts.
# scripts/fetch-sparkle.sh downloads the official 2.9.4 release archive with a
# pinned checksum and validates the universal framework before xcodegen runs.

targets:
  Burrow:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        # LaunchDaemons is excluded from the plain resource copy and staged by
        # the dedicated phase below instead: a stray second copy under
        # Resources/ would be dead weight inside the signed bundle.
        excludes: ["Info.plist", "Burrow.entitlements", "LaunchDaemons"]
      # SMAppService.daemon(plistName:) resolves the daemon from exactly this
      # path and nowhere else.
      - path: Resources/LaunchDaemons/dev.caezium.Burrow.privileged-helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true   # menu-bar agent, no Dock icon
        CFBundleDisplayName: Burrow
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "MIT License. © 2026 Henry Zhang."
        # Burrow uses only exempt encryption supplied by macOS (for example,
        # URLSession HTTPS); it contains no proprietary or non-exempt crypto.
        ITSAppUsesNonExemptEncryption: false
        # Stable latest-release asset. The appcast and every archive are
        # Ed25519 signed; release.yml rejects a missing/invalid key or feed.
        SUFeedURL: "https://github.com/caezium/Burrow/releases/latest/download/appcast.xml"
        SUPublicEDKey: "f1LoqtxmfTxFgz2S5KlTQzZzhmOB8J8r5UdTRH48hvU="
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUEnableSystemProfiling: false
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
        # Friendly, one-time prompts for the standard folders Mole scans
        # (purge/installer touch these). Full Disk Access still covers the
        # cache/container locations — see the in-app FDA gate.
        NSDesktopFolderUsageDescription: "Burrow scans your Desktop for reclaimable artifacts and leftover installers."
        NSDocumentsFolderUsageDescription: "Burrow scans your Documents for reclaimable project artifacts."
        NSDownloadsFolderUsageDescription: "Burrow scans your Downloads for leftover installer files (.dmg, .pkg)."
        NSRemovableVolumesUsageDescription: "Burrow analyzes external drives when you point it at them."
        # Telemetry keys, expanded from build settings at build time. Empty in
        # dev builds (the defaults below) → analytics/crash reporting stay off.
        # A release injects real values via `xcodebuild VAR=...` (see scripts/).
        PHPostHogApiKey: "$(POSTHOG_API_KEY)"
        PHPostHogHost: "$(POSTHOG_HOST)"
        SentryDSN: "$(SENTRY_DSN)"
    entitlements:
      path: Resources/Burrow.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.caezium.Burrow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Telemetry defaults: empty → off. Releases override these on the
        # xcodebuild command line (sourced from the gitignored release.env).
        POSTHOG_API_KEY: ""
        POSTHOG_HOST: "https://us.i.posthog.com"
        SENTRY_DSN: ""
    dependencies:
      - framework: vendor/Sparkle.framework
        embed: true
      - framework: vendor/Sentry.xcframework
        embed: false
      # The privileged helper ships INSIDE the app. It is never installed to
      # /Library/PrivilegedHelperTools, so it cannot drift from, or outlive,
      # the app that vouches for it — SMAppService resolves it through the
      # bundle via the BundleProgram key in the launchd plist.
      # Copied into Contents/MacOS, beside the app's own executable, which is
      # where BundleProgram in the launchd plist points.
      - target: BurrowHelper
        copy:
          destination: executables
    postBuildScripts:
      - name: Bundle burrow-engine (MIT)
        basedOnDependencyAnalysis: false
        script: |
          # Build the ONE MIT `burrow-engine` binary and stage it as Resources/burrow — it does all
          # the work natively AND emits the stable Burrow envelope + NDJSON streaming, so it replaces
          # both the old burrow-cli conductor and the burrow-digger engine (a single binary, no
          # separate engine dir). Activates when a burrow-engine checkout is present — a release/CI
          # vendors it (vendor/burrow-engine) or sets BURROW_ENGINE_SRC; dev builds without it fall
          # back to a system-installed engine.
          #
          # NOTE: Xcode's CodeSign phase runs AFTER all build phases, so it re-signs the app over the
          # freshly-added binary and the resource seal ends up stale. The final seal therefore
          # happens POST-build: use scripts/build.sh locally, and the release pipeline's inside-out
          # re-sign (#178) seals it for distribution.
          ENGINE_SRC="${BURROW_ENGINE_SRC:-$SRCROOT/vendor/burrow-engine}"
          # Require a real engine checkout, not just the gitlink dir: a plain (no-submodule)
          # checkout — e.g. the PR `ci` job — leaves an EMPTY vendor/burrow-engine dir, so `[ -d ]`
          # alone would be true and the cargo build would fail from missing source. Gate on
          # Cargo.toml + src/ + cargo so we bundle only a populated checkout, and otherwise fall
          # through to the system engine (build still green).
          if [ -f "$ENGINE_SRC/Cargo.toml" ] && [ -d "$ENGINE_SRC/src" ] && command -v cargo >/dev/null 2>&1; then
            "$SRCROOT/scripts/bundle-burrow.sh" "$ENGINE_SRC" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
              || echo "warning: burrow-engine build failed — Burrow falls back to a system engine."
          else
            echo "warning: burrow-engine source or cargo not present at $ENGINE_SRC — Burrow falls back to a system engine. Set BURROW_ENGINE_SRC or init the vendor/burrow-engine submodule."
          fi
      - name: Bundle fclones (MIT sidecar)
        basedOnDependencyAnalysis: false
        script: |
          # COPY the cached universal `fclones` beside the conductor so the Duplicates pane works
          # with zero install — `burrow dupes` resolves it via $BURROW_FCLONES (set by the app to
          # this bundled copy). This phase NEVER builds fclones (that heavy step is release-only,
          # scripts/build-fclones.sh); it copies the cache and otherwise skips gracefully, so a
          # disk-constrained local build is never at risk. Final seal happens POST-build.
          "$SRCROOT/scripts/bundle-fclones.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            || echo "warning: fclones bundling skipped — Duplicates falls back to a system/\$BURROW_FCLONES fclones."

  # The privileged helper: a bare launchd daemon that runs as root.
  #
  # Deliberately minimal. It compiles ONLY the shared contract in
  # Sources/PrivilegedHelper plus its own HelperSources — no SwiftUI, no
  # Sparkle, no Sentry, no telemetry. Nothing that could pull UI, networking,
  # or crash-reporting code into a root process, and nothing that could grow a
  # dependency without that showing up as a change to this list.
  BurrowHelper:
    type: tool
    platform: macOS
    sources:
      # Shared with the app so the two can never disagree about what a request
      # means. Same files, both targets.
      - path: Sources/PrivilegedHelper
      - path: HelperSources
    settings:
      base:
        PRODUCT_NAME: BurrowHelper
        PRODUCT_BUNDLE_IDENTIFIER: dev.caezium.Burrow.privileged-helper
        # The helper reports its OWN build over XPC, and the client refuses a
        # helper whose build doesn't match the app's. Baking the plist into the
        # binary means it reports what it IS, rather than reading whatever
        # bundle happens to surround it after an update.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
        # Version/build inherit the repository-wide settings above. The app
        # plist also references those settings, so helper/app skew cannot be
        # introduced by changing a second declaration.
        SKIP_INSTALL: YES

  BurrowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    info:
      path: Tests/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.caezium.BurrowTests
    dependencies:
      - target: Burrow
      # The tests import Burrow's compiled Swift module, which records Sparkle
      # as a module dependency. Local frameworks are not propagated through a
      # target dependency the way Swift package products are, so expose its
      # module to the test compiler without embedding another copy.
      - framework: vendor/Sparkle.framework
        embed: false

# Shared scheme so `xcodebuild test` works headlessly (CI and CLI runs)
# instead of depending on Xcode auto-creating a local scheme on first open.
schemes:
  Burrow:
    build:
      targets:
        Burrow: all
        BurrowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BurrowTests
